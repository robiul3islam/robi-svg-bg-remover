name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare Capacitor project
        run: |
          mkdir -p build/www && cd build
          cp ../app.html www/index.html
          cp ../icon-*.png ../logo.png www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SVG BG Remover" com.robigraphics.svgbgremover --web-dir www
          npx cap add android
          printf '\nconfigurations.all {\n  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"\n  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"\n}\n' >> android/app/build.gradle
          npx cap sync android
      - name: Build APK
        run: cd build/android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK
        run: cp build/android/app/build/outputs/apk/debug/app-debug.apk RobiGraphics.apk
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Android APK
          artifacts: RobiGraphics.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
